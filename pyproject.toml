[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyarrow>=15", "requests>=2.31", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5", "pyyaml"]
warehouse = ["dbt-core>=1.9", "dbt-athena>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["data: checks on real files in data/raw (skipped if absent)"]
