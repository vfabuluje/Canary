[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyarrow>=15", "requests>=2.31", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5", "pyyaml"]
model = ["xgboost>=2.1,<4", "scikit-learn>=1.5"]
analyst = ["anthropic>=1.17,<2"]  # tested with 1.17.0
dashboard = ["streamlit>=1.67,<2", "altair>=5,<6", "rapidfuzz>=3,<4"]
warehouse = ["dbt-core>=1.10.5,<1.11", "dbt-athena>=1.10,<1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"canary.dashboard" = ["web/*.js", "web/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["data: checks on real files in data/raw (skipped if absent)"]
