version: 2

models:
  - name: dim_failed_banks
    description: "One row per bank that failed (not assisted) since 2001. Filter and select only on stg_fdic__failures; no dedup, so a duplicate cert fails the unique test. Dollars in $ thousands."
    columns:
      - name: cert
        description: "FDIC certificate number; joins to financials. Integer; never null here (rows without a cert are filtered out)."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fdic__financials')
                field: cert
              config:
                severity: warn
      - name: institution_name
        description: "Legal name of the failed bank (assistance transactions are excluded). Text."
      - name: failure_date
        description: "Date the bank failed or was taken over. Date."
      - name: estimated_loss
        description: "Estimated loss to the Deposit Insurance Fund. $ thousands. Null before 1986."
      - name: total_assets_at_failure
        description: "Total assets at the last report before failure. $ thousands."

  - name: fct_bank_quarters
    description: "One row per bank per quarter: every stg_fdic__financials column plus the bank's failure date and quarters until failure. Phase 3 trains on this table. Dollars in $ thousands, ratios in percent, income fields year-to-date."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cert, report_date]
    columns:
      - name: cert
        description: "FDIC certificate number: the bank's unique ID. Key with report_date. Integer."
        data_tests: [not_null]
      - name: report_date
        description: "Quarter-end date of the snapshot (from raw repdte). Date, e.g. 2022-12-31."
        data_tests: [not_null]
      - name: institution_name
        description: "The bank's legal name as of that quarter. Text; names change over time."
      - name: state
        description: "Two-letter state where the bank is based. Text."
      - name: institution_class
        description: "Charter class: type of bank charter and supervisor (FDIC class code). Code."
      - name: holding_company_name
        description: "Regulatory top-holder holding company name. Text; null if no holding company."
      - name: total_assets
        description: "Everything the bank owns; the standard size measure. $ thousands."
      - name: total_liabilities
        description: "Everything the bank owes. $ thousands."
      - name: total_deposits
        description: "Money customers have placed in the bank. $ thousands."
      - name: equity_capital
        description: "Assets minus liabilities: the loss-absorbing cushion. $ thousands."
      - name: gross_loans_and_leases
        description: "Total loans and leases before loss reserves. $ thousands."
      - name: total_securities
        description: "Total bonds and other securities held. $ thousands."
      - name: leverage_ratio
        description: "Core capital as a share of average assets (PCA leverage ratio). Percent."
      - name: tier1_risk_based_ratio
        description: "Tier 1 capital as a share of risk-weighted assets. Percent. May be null or 0 in early years."
      - name: total_risk_based_ratio
        description: "Total regulatory capital as a share of risk-weighted assets. Percent."
      - name: equity_to_assets_ratio
        description: "Equity capital as a share of total assets. Percent."
      - name: noncurrent_loans
        description: "Loans 90+ days past due or no longer accruing interest. $ thousands."
      - name: nonaccrual_assets
        description: "Assets on which interest is no longer being counted. $ thousands."
      - name: past_due_30_89_assets
        description: "Assets 30-89 days past due and still accruing. $ thousands."
      - name: past_due_90_plus_assets
        description: "Assets 90+ days past due and still accruing. $ thousands."
      - name: other_real_estate_owned
        description: "Foreclosed property held by the bank. $ thousands."
      - name: loan_loss_allowance
        description: "Reserve set aside for expected loan losses. $ thousands."
      - name: net_charge_offs
        description: "Loans written off minus recoveries. $ thousands, year-to-date (Q4 = full year)."
      - name: provision_for_credit_losses
        description: "Amount charged to earnings to add to the loss reserve. $ thousands, year-to-date (Q4 = full year)."
      - name: real_estate_loans
        description: "Loans secured by real estate. $ thousands."
      - name: construction_land_loans
        description: "Real estate construction and land development loans. $ thousands."
      - name: commercial_real_estate_loans
        description: "Nonfarm nonresidential real estate loans. $ thousands."
      - name: commercial_industrial_loans
        description: "Commercial and industrial (business) loans. $ thousands."
      - name: net_income
        description: "Profit after all expenses and taxes. $ thousands, year-to-date (Q4 = full year)."
      - name: return_on_assets
        description: "Profit as a share of assets. Percent. Annualized, year-to-date."
      - name: return_on_equity
        description: "Profit as a share of equity. Percent. Annualized, year-to-date."
      - name: net_interest_margin
        description: "Interest earned minus interest paid, as a share of earning assets. Percent. Annualized, year-to-date."
      - name: total_interest_expense
        description: "Total interest paid on deposits and borrowings. $ thousands, year-to-date (Q4 = full year)."
      - name: efficiency_ratio
        description: "Operating costs per dollar of revenue. Percent. Ratio of two year-to-date amounts; not annualized."
      - name: uninsured_deposits
        description: "Estimated deposits above the federal insurance limit. $ thousands. Estimate; often 0 or null for small banks and early years."
      - name: brokered_deposits
        description: "Deposits obtained through brokers. $ thousands."
      - name: core_deposits
        description: "Stable deposits (broadly total minus large time and brokered). $ thousands."
      - name: fhlb_advances
        description: "Federal Home Loan Bank advances (other liabilities-FHLB). $ thousands."
      - name: volatile_liabilities
        description: "Funding that can leave quickly. $ thousands."
      - name: cash_and_due_from_banks
        description: "Cash and balances at other banks. $ thousands."
      - name: net_loans_to_deposits_ratio
        description: "Net loans and leases as a share of deposits. Percent."
      - name: htm_securities_amortized_cost
        description: "Held-to-maturity securities at amortized cost. $ thousands. 0 may mean not reported."
      - name: htm_securities_fair_value
        description: "Held-to-maturity securities at market value. $ thousands. 0 may mean not reported."
      - name: afs_securities_amortized_cost
        description: "Available-for-sale securities at amortized cost. $ thousands. 0 may mean not reported."
      - name: afs_securities_fair_value
        description: "Available-for-sale securities at market value. $ thousands. 0 may mean not reported."
      - name: ingested_at
        description: "When Canary pulled this row from the FDIC API. UTC timestamp; not an FDIC field."
      - name: failure_date
        description: "LABEL ONLY, never a model input. Date this bank failed, from dim_failed_banks. Date; null if the bank never failed (or failed before 2001)."
      - name: quarters_until_failure
        description: "LABEL ONLY, never a model input. Calendar quarters from report_date to the failure quarter. Integer; null if the bank never failed. report_date is a quarter-end, so 0 or less would mean a report dated after the failure; the test forbids it. Null in the last 4 quarters (2025-09-30 to 2026-06-30) means not yet known, not safe."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
              config:
                where: "quarters_until_failure is not null"

  - name: fct_bank_features
    description: "One row per bank per quarter: 31 CAMELS-style model features built from fct_bank_quarters, plus the keys cert and report_date. No label, name or failure columns. FDIC ratio fields stay in percent; ratios computed here are fractions. Year-to-date dollars are annualized (x 4 / quarter number). Growth looks back exactly 12 months only."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cert, report_date]
    columns:
      - name: cert
        description: "FDIC certificate number: the bank's unique ID. Key with report_date. Integer."
        data_tests: [not_null]
      - name: report_date
        description: "Quarter-end date of the snapshot. Date, e.g. 2022-12-31."
        data_tests: [not_null]
      - name: equity_to_assets
        description: "FDIC's equity capital as a share of total assets (passed through from equity_to_assets_ratio). Percent, e.g. 8.5 means 8.5%."
      - name: leverage_ratio
        description: "Core capital as a share of average assets (FDIC leverage ratio), unchanged. Percent."
      - name: tier1_risk_based_ratio
        description: "Tier 1 capital as a share of risk-weighted assets, unchanged except 0 becomes null (community bank leverage ratio banks stop reporting it from 2020). Percent."
      - name: total_risk_based_ratio
        description: "Total regulatory capital as a share of risk-weighted assets, unchanged except 0 becomes null (same 2020 reason). Percent."
      - name: noncurrent_loans_to_loans
        description: "Loans 90+ days past due or not accruing interest, divided by gross loans. Fraction (0.02 = 2%). Null if no loans."
      - name: nonaccrual_ore_to_assets
        description: "(Nonaccrual assets + foreclosed real estate) divided by total assets. Fraction."
      - name: past_due_30_89_to_assets
        description: "Assets 30-89 days past due and still accruing, divided by total assets. Fraction."
      - name: allowance_to_loans
        description: "Loan-loss reserve divided by gross loans. Fraction."
      - name: net_charge_offs_to_loans_ann
        description: "Net charge-offs (year-to-date x 4 / quarter number) divided by gross loans. Annualized fraction."
      - name: provision_to_assets_ann
        description: "Provision for credit losses (year-to-date x 4 / quarter number) divided by total assets. Annualized fraction."
      - name: construction_loans_to_loans
        description: "Construction and land development loans divided by gross loans. Fraction; expected between 0 and 1."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: cre_loans_to_loans
        description: "Nonfarm nonresidential (commercial real estate) loans divided by gross loans. Fraction; expected between 0 and 1."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: texas_ratio
        description: "(Noncurrent loans + foreclosed real estate) divided by (equity + loan-loss reserve): bad assets relative to the cushion that absorbs them. Fraction; 1.0 means bad assets equal the whole cushion."
      - name: return_on_assets
        description: "FDIC's annualized profit as a share of assets, unchanged. Percent."
      - name: return_on_equity
        description: "FDIC's annualized profit as a share of equity, unchanged. Percent."
      - name: net_interest_margin
        description: "FDIC's annualized net interest income as a share of earning assets, unchanged. Percent."
      - name: efficiency_ratio
        description: "FDIC's operating cost per dollar of revenue, unchanged. Percent."
      - name: interest_expense_to_assets_ann
        description: "Total interest expense (year-to-date x 4 / quarter number) divided by total assets. Annualized fraction."
      - name: loans_to_deposits
        description: "FDIC's net loans and leases as a share of deposits, unchanged. Percent."
      - name: uninsured_to_deposits
        description: "Estimated uninsured deposits divided by total deposits. Fraction; expected between 0 and 1. Uninsured of 0 is treated as not reported (null)."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: brokered_to_deposits
        description: "Brokered deposits divided by total deposits. Fraction; expected between 0 and 1. A 0 is a real zero."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: core_deposits_to_assets
        description: "Stable core deposits divided by total assets. Fraction."
      - name: fhlb_to_assets
        description: "Federal Home Loan Bank advances divided by total assets. Fraction."
      - name: volatile_liabilities_to_assets
        description: "Funding that can leave quickly divided by total assets. Fraction."
      - name: cash_to_assets
        description: "Cash and balances at other banks divided by total assets. Fraction."
      - name: htm_unrealized_loss_to_equity
        description: "(Held-to-maturity amortized cost - fair value) divided by equity: how much of the cushion the unrealized bond loss would eat. Fraction (SVB 2022-12-31 is about 0.98). 0 when cost is 0; null when cost is above 0 but fair value is 0 or missing."
      - name: afs_unrealized_loss_to_equity
        description: "(Available-for-sale amortized cost - fair value) divided by equity. Fraction. Same 0/null rule as the HTM feature."
      - name: securities_to_assets
        description: "Total securities divided by total assets. Fraction."
      - name: log_total_assets
        description: "Natural log of total assets ($ thousands): a bank-size measure. Null if assets are 0 or less."
      - name: asset_growth_4q
        description: "Total assets now divided by total assets 12 months earlier, minus 1. Fraction (0.10 = 10% growth). Null when the bank has no row exactly 12 months earlier. Looks backward only."
      - name: deposit_growth_4q
        description: "Total deposits now divided by total deposits 12 months earlier, minus 1. Fraction. Null with no row 12 months earlier. Looks backward only."
