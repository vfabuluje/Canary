canary:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: us-east-1
      database: awsdatacatalog
      schema: canary_staging
      work_group: canary
      s3_staging_dir: "s3://{{ env_var('CANARY_BUCKET') }}/athena-results/"
      s3_data_dir: "s3://{{ env_var('CANARY_BUCKET') }}/dbt/"
      s3_data_naming: schema_table
      aws_profile_name: "{{ env_var('AWS_PROFILE', 'canary') }}"
      threads: 4
