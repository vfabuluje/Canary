name: Keep dashboard awake

# Visit the Streamlit Community Cloud app in a headless browser so it
# registers a real visitor and doesn't go to sleep. A plain curl GET only
# fetched Streamlit's page shell (200 even when asleep), so it didn't count.
# Scheduled runs only fire from the default branch.
on:
  schedule:
    # Every 6 hours at :23. GitHub often starts top-of-the-hour runs hours
    # late or skips them; an odd minute and a shorter gap keep us under 12 h.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://canarybank.streamlit.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visit dashboard
        run: python .github/scripts/keep_alive.py
